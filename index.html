```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Access</title>
  <style>
    :root {
      --bg: #05160f;
      --bg-2: #0d2d22;
      --panel: rgba(10, 24, 18, 0.82);
      --line: rgba(94, 255, 166, 0.8);
      --green: #67ffb1;
      --green-2: #2dff8a;
      --green-3: #b8ffd9;
      --danger: #ff4d4d;
      --text: #d9ffe8;
      --muted: #8ac9a7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, var(--bg-2), var(--bg) 55%, #010a08 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(103, 255, 177, 0.08),
        rgba(103, 255, 177, 0.08) 2px,
        transparent 2px,
        transparent 5px
      );
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .panel {
      width: min(100%, 460px);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 0 30px rgba(45, 255, 138, 0.28), inset 0 0 20px rgba(103, 255, 177, 0.08);
      border-radius: 18px;
      padding: 28px 26px;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand-mark {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--green-3);
      text-transform: uppercase;
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(103, 255, 177, 0.05);
    }

    .status {
      color: var(--green);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      letter-spacing: 1.7px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--green-3);
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: rgba(4, 18, 12, 0.8);
      color: var(--text);
      border: 1px solid rgba(103, 255, 177, 0.7);
      border-radius: 10px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      box-shadow: 0 0 0 3px rgba(103, 255, 177, 0.15);
      border-color: var(--green);
    }

    button {
      width: 100%;
      margin-top: 10px;

      border-radius: 10px;
      padding: 15px 16px;
      background: linear-gradient(135deg, var(--green-2), var(--green));
      color: #04170e;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;

    button:hover {

    .hidden {

    .scan-panel {
      width: min(100%, 620px);
      background: rgba(7, 18, 12, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 30px;

    .scan-top {
      display: flex;
      align-items: center;

    }

    .scan-message {

    .ring {
      width: 126px;

    .ring::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(103, 255, 177, 0.55);

    .progress {
      width: 100%;

      color: var(--green);

      line-height: 1.8;

    }

    .time {

    }

      .screen {
        padding: 16px;

        width: min(100%, 360px);

      }

        margin-bottom: 14px;
      }

      }

      button {
        padding: 13px 14px;

      }

      .scan-top {
        gap: 12px;
      }

      .scan-title {
        font-size: 26px;
      }

      .ring {
        width: 96px;
        height: 96px;
      }

      .time {
        font-size: 30px;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes blink {
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="panel" id="login">
      <div class="brand">
        <div class="brand-mark">NEXUS</div>
        <div class="status">Secure</div>
      </div>

      <h1 class="title">Device Access</h1>
      <p class="subtitle">Authentication required</p>

      <div class="field">
        <label for="user">Username</label>
        <input id="user" type="text" placeholder="Enter username" />
      </div>

      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Enter password" />
      </div>

      <button type="button" onclick="startScan()">Authenticate</button>

      <div class="meta">System v7.4.2</div>
    </section>

    <section class="scan-panel hidden" id="scan">
      <div class="scan-top">
        <h2 class="scan-title">Threat Scan</h2>
        <span class="orb"></span>
      </div>

      <div class="scan-message">Unauthorized access detected</div>

      <div class="ring"></div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="percent" id="percent">0%</div>

      <div class="terminal" id="terminal">&gt; Initializing system audit...</div>
      <div class="time" id="timer">05:00</div>
      <div class="footer-text">Monitoring active</div>
    </section>
  </div>

  <script>
    let time = 300;
    let progress = 0;
    let scanInterval = null;

    function speakWarning() {
      if (!('speechSynthesis' in window)) return;

      const voice = new SpeechSynthesisUtterance(
        "Warning. Sensitive app data is being leaked. Security breach detected. Immediate action required."
      );
      voice.rate = 0.8;
      voice.pitch = 0.7;
      voice.volume = 1;
      window.speechSynthesis.speak(voice);
    }

    function startScan() {
      const login = document.getElementById('login');
      const scan = document.getElementById('scan');
      if (login) login.classList.add('hidden');
      if (scan) scan.classList.remove('hidden');

      const bar = document.getElementById('bar');
      const percent = document.getElementById('percent');
      const timer = document.getElementById('timer');
      const terminal = document.getElementById('terminal');

      let voiceCount = 0;
      function repeatVoice() {
        if (voiceCount >= 10) return;
        speakWarning();
        voiceCount++;
        setTimeout(repeatVoice, 5000);
      }
      repeatVoice();

      if (scanInterval) clearInterval(scanInterval);

      scanInterval = setInterval(() => {
        progress += 1;
        if (progress > 100) progress = 1;

        bar.style.width = progress + '%';
        percent.textContent = progress + '%';

        const min = Math.floor(time / 60);
        const sec = time % 60;
        timer.textContent = String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        time--;

        if (time < 0) time = 300;

        const lines = [
          '> Scanning kernel modules...',
          '> Checking access vectors...',
          '> Validating system integrity...',
          '> Mapping network traffic...',
          '> Monitoring active processes...',
          '> Analyzing encryption layers...',
          '> Compiling security report...'
        ];

        terminal.textContent = lines[Math.floor(Math.random() * lines.length)];
      }, 1000);
    }
  </script>
</body>
</html>
